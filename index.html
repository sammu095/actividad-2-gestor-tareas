<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplicación sencilla para organizar tareas personales.">
  <title>Gestor de Tareas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <p class="etiqueta">ORGANIZA TU DÍA</p>
      <h1>Gestor de tareas</h1>
      <p class="subtitulo">Anota lo que necesitas hacer y avanza paso a paso.</p>
    </header>

    <section class="panel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Mis tareas</h2>
      <form id="formulario-tarea" class="formulario">
        <label for="nueva-tarea">Nueva tarea</label>
        <div class="fila-entrada">
          <input
            type="text"
            id="nueva-tarea"
            name="nueva-tarea"
            maxlength="120"
            placeholder="Ej. Terminar actividad de Full Stack"
            autocomplete="off"
            required
          >
          <button type="submit" class="boton boton-principal">Agregar tarea</button>
        </div>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </form>

      <div class="resumen" aria-live="polite">
        <span id="contador">0 tareas</span>
        <button type="button" id="limpiar-completadas" class="boton-enlace">Limpiar completadas</button>
      </div>

      <ul id="lista-tareas" class="lista-tareas" aria-label="Lista de tareas"></ul>
      <p id="lista-vacia" class="lista-vacia">Todavía no tienes tareas. ¡Agrega la primera!</p>
    </section>

    <footer class="pie">
      <p>Proyecto académico · JavaScript ES6+ y programación orientada a objetos</p>
    </footer>
  </main>
</body>
</html>
